
name: Update GitHub Language Radar

on:
  push:
    paths-ignore:
      - "skill-radar.svg"
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: skill-radar-update
  cancel-in-progress: false

jobs:
  update-radar:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout profile repository
        uses: actions/checkout@v4

      - name: Generate radar SVG
        env:
          GH_USERNAME: ${{ github.repository_owner }}
          GH_TOKEN: ${{ github.token }}
        run: python generate_skill_radar.py

      - name: Commit updated SVG
        run: |
          if git diff --quiet -- skill-radar.svg; then
            echo "Radar is already up to date."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          git add skill-radar.svg
          git commit -m "Update GitHub language radar"
          git push
