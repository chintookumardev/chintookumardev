💻 My Academic Focus

I'm pursuing a Bachelor of Computer Applications (BCA) at Inderprastha Engineering College, Ghaziabad, while developing practical skills in software development and modern web technologies.

My goal is to combine my academic foundation with hands-on projects to become a capable full-stack developer.

