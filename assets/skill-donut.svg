<svg xmlns="http://www.w3.org/2000/svg" width="760" height="390" viewBox="0 0 760 390" role="img" aria-labelledby="title desc">
  <title id="title">Development Focus Distribution</title>
  <desc id="desc">Illustrative distribution of focus across frontend, backend, Java and OOP, databases, Python and SQL, and developer tools.</desc>
  <rect width="760" height="390" rx="20" fill="#0d1117"/>
  <text x="380" y="39" text-anchor="middle" fill="#f0f6fc" font-family="Arial,sans-serif" font-size="23" font-weight="700">DEVELOPMENT FOCUS DISTRIBUTION</text>
  <text x="380" y="62" text-anchor="middle" fill="#8b949e" font-family="Arial,sans-serif" font-size="12">ILLUSTRATIVE CATEGORY ALLOCATION · EDIT AS NEEDED</text>
  <circle cx="230" cy="220" r="94" fill="none" stroke="#212936" stroke-width="30"/>
  <g transform="rotate(-90 230 220)" fill="none" stroke-width="30">
    <circle cx="230" cy="220" r="94" stroke="#36bcf7" stroke-dasharray="147.65 443.15" stroke-dashoffset="0"/>
    <circle cx="230" cy="220" r="94" stroke="#8b5cf6" stroke-dasharray="118.12 472.68" stroke-dashoffset="-147.65"/>
    <circle cx="230" cy="220" r="94" stroke="#10b981" stroke-dasharray="118.12 472.68" stroke-dashoffset="-265.77"/>
    <circle cx="230" cy="220" r="94" stroke="#f59e0b" stroke-dasharray="88.59 502.21" stroke-dashoffset="-383.89"/>
    <circle cx="230" cy="220" r="94" stroke="#ec4899" stroke-dasharray="59.06 531.74" stroke-dashoffset="-472.48"/>
    <circle cx="230" cy="220" r="94" stroke="#64748b" stroke-dasharray="59.06 531.74" stroke-dashoffset="-531.54"/>
  </g>
  <text x="230" y="213" text-anchor="middle" fill="#f0f6fc" font-family="Arial,sans-serif" font-size="23" font-weight="700">6 AREAS</text>
  <text x="230" y="237" text-anchor="middle" fill="#8b949e" font-family="Arial,sans-serif" font-size="12">Development</text>
  <g font-family="Arial,sans-serif" font-size="14" fill="#e6edf3">
    <circle cx="405" cy="125" r="6" fill="#36bcf7"/><text x="421" y="130">Frontend</text><text x="690" y="130" text-anchor="end" fill="#a5f3fc">25%</text>
    <circle cx="405" cy="163" r="6" fill="#8b5cf6"/><text x="421" y="168">Backend / MERN</text><text x="690" y="168" text-anchor="end" fill="#a5f3fc">20%</text>
    <circle cx="405" cy="201" r="6" fill="#10b981"/><text x="421" y="206">Java &amp; OOP</text><text x="690" y="206" text-anchor="end" fill="#a5f3fc">20%</text>
    <circle cx="405" cy="239" r="6" fill="#f59e0b"/><text x="421" y="244">Databases</text><text x="690" y="244" text-anchor="end" fill="#a5f3fc">15%</text>
    <circle cx="405" cy="277" r="6" fill="#ec4899"/><text x="421" y="282">Python &amp; SQL</text><text x="690" y="282" text-anchor="end" fill="#a5f3fc">10%</text>
    <circle cx="405" cy="315" r="6" fill="#64748b"/><text x="421" y="320">Developer Tools</text><text x="690" y="320" text-anchor="end" fill="#a5f3fc">10%</text>
  </g>
  <text x="380" y="363" text-anchor="middle" fill="#8b949e" font-family="Arial,sans-serif" font-size="11">These percentages describe an illustrative focus mix, not GitHub statistics.</text>
</svg>
