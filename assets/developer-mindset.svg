<svg xmlns="http://www.w3.org/2000/svg" width="900" height="300" viewBox="0 0 900 300" role="img" aria-labelledby="title desc">
  <title id="title">Developer Mindset</title>
  <desc id="desc">A continuous improvement cycle: Learn, Build, Solve, and Grow.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#101b31"/>
      <stop offset="1" stop-color="#0d1117"/>
    </linearGradient>
  </defs>
  <rect width="900" height="300" rx="22" fill="url(#bg)" stroke="#25364c"/>
  <text x="450" y="44" text-anchor="middle" fill="#f0f6fc" font-family="Arial,sans-serif" font-size="26" font-weight="700">DEVELOPER MINDSET</text>
  <text x="450" y="68" text-anchor="middle" fill="#9fb3c8" font-family="Arial,sans-serif" font-size="13">CONTINUOUS LEARNING · PRACTICAL BUILDING · ITERATIVE IMPROVEMENT</text>
  <g>
    <rect x="38" y="105" width="184" height="104" rx="14" fill="#102b46" stroke="#36bcf7" stroke-width="2"/>
    <rect x="258" y="105" width="184" height="104" rx="14" fill="#21183f" stroke="#8b5cf6" stroke-width="2"/>
    <rect x="478" y="105" width="184" height="104" rx="14" fill="#10372d" stroke="#10b981" stroke-width="2"/>
    <rect x="698" y="105" width="164" height="104" rx="14" fill="#3b2911" stroke="#f59e0b" stroke-width="2"/>
  </g>
  <g font-family="Arial,sans-serif" text-anchor="middle">
    <text x="130" y="144" fill="#7dd3fc" font-size="14">01</text>
    <text x="130" y="170" fill="#ffffff" font-size="23" font-weight="700">LEARN</text>
    <text x="130" y="191" fill="#c9d1d9" font-size="11">Build fundamentals</text>
    <text x="350" y="144" fill="#c4b5fd" font-size="14">02</text>
    <text x="350" y="170" fill="#ffffff" font-size="23" font-weight="700">BUILD</text>
    <text x="350" y="191" fill="#c9d1d9" font-size="11">Create real projects</text>
    <text x="570" y="144" fill="#6ee7b7" font-size="14">03</text>
    <text x="570" y="170" fill="#ffffff" font-size="23" font-weight="700">SOLVE</text>
    <text x="570" y="191" fill="#c9d1d9" font-size="11">Test and debug</text>
    <text x="780" y="144" fill="#fcd34d" font-size="14">04</text>
    <text x="780" y="170" fill="#ffffff" font-size="23" font-weight="700">GROW</text>
    <text x="780" y="191" fill="#c9d1d9" font-size="11">Review and improve</text>
  </g>
  <g fill="none" stroke="#8293a8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M225 157 H250 M243 150 L250 157 L243 164"/>
    <path d="M445 157 H470 M463 150 L470 157 L463 164"/>
    <path d="M665 157 H690 M683 150 L690 157 L683 164"/>
    <path d="M780 219 V245 H130 V219 M123 226 L130 219 L137 226"/>
  </g>
  <text x="450" y="273" text-anchor="middle" fill="#a5f3fc" font-family="Arial,sans-serif" font-size="14" font-weight="700">LEARN → BUILD → SOLVE → GROW → REPEAT</text>
</svg>
